name: Feature Request
description: Propose a new feature for Pulse
labels: ["feature-request"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One-liner — what does this feature do for the user?
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Why does this feature matter? What pain point or opportunity does it address?
    validations:
      required: true

  - type: textarea
    id: user-stories
    attributes:
      label: User Stories
      description: "As a [user type], I want to [action], so that [outcome]"
      value: |
        - As a user, I want to ..., so that ...
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: What must be true for this feature to be considered done?
      value: |
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: design-notes
    attributes:
      label: Design Notes
      description: Rough UX/UI direction, wireframe ideas, or interaction details
    validations:
      required: false

  - type: textarea
    id: technical-considerations
    attributes:
      label: Technical Considerations
      description: Key implementation notes, dependencies, API changes, DB schema changes
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0 — Critical
        - P1 — High
        - P2 — Medium
        - P3 — Nice to have
    validations:
      required: true

  - type: dropdown
    id: effort
    attributes:
      label: Effort Estimate
      options:
        - S (< 1 day)
        - M (1-3 days)
        - L (3-7 days)
        - XL (1+ weeks)
    validations:
      required: true
