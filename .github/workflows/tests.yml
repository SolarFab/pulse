name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  vitest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Type errors are not test failures, and vitest does not run tsc. A commit
      # that added a field to a type but not to the mapping went green here and
      # would have failed only at Vercel's build. Catch it before deploy.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test
